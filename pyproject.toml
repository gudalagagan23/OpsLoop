[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opsloop"
version = "0.0.1"
description = "Multi-agent IT operations platform over a simulated SaaS app: autonomous investigation and fix proposal, human-gated release."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "alembic>=1.13",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "prometheus-client>=0.20",
    "pyjwt>=2.8",
    "anthropic>=2.3,<3",
    "pgvector>=0.5",
    "fastembed>=0.9",
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.2",
    "bandit>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
include = ["opsloop*", "taskflow*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.ini", "*.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a running Postgres (docker compose up postgres)",
    "sandbox: needs Docker and the opsloop-sandbox image; slow",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# Line width is the formatter's job; long regexes and test data cannot be wrapped.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105"]
"sandbox_tests/**" = ["S101", "S105", "S608"]
"opsloop/testloop/reference_fixes.py" = ["S101"]
"opsloop/sandbox/runner.py" = ["S105", "S607"]
"opsloop/deploy/candidate.py" = ["S607"]  # fixed docker and git CLI calls  # fixed docker/git CLI; throwaway sandbox DB password
# f-strings there only interpolate the constant schema name; all values are bound parameters.
"taskflow/api/main.py" = ["S608"]
"taskflow/api/seed.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["opsloop", "taskflow"]
plugins = ["pydantic.mypy"]
