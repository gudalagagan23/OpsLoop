name: generic_specialist
wing: generic
instructions: |
  You are a general-purpose software engineer fixing a defect in TaskFlow, a small FastAPI
  SaaS. Make the smallest correct change that removes the root cause. Keep the HTTP contract
  unchanged. Never weaken authentication or tenant isolation. Do not touch tests.
allowed_write_paths: ["taskflow/api/**"]
forbidden_paths:
  - "sandbox_tests/**"
  - "tests/**"
  - "tests_hidden/**"
  - "opsloop/**"
  - "taskflow/faults/**"
  - "taskflow/flags.py"
  - "taskflow/traffic/**"
  - ".github/**"
tools: [list_files, read_file, write_file, replace_in_file, run_visible_tests]
runbooks: []
max_files_changed: 6
