# Everything here is simulated: TaskFlow, its tenants, traffic and planted faults.
name: opsloop

x-python: &python
  build:
    context: .
    dockerfile: docker/python.Dockerfile
  image: opsloop-python:dev

x-db-env: &db-env
  OPSLOOP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-opsloop}:${POSTGRES_PASSWORD:-opsloop}@postgres:5432/${POSTGRES_DB:-opsloop}
  TASKFLOW_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-opsloop}:${POSTGRES_PASSWORD:-opsloop}@postgres:5432/${POSTGRES_DB:-opsloop}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opsloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsloop}
      POSTGRES_DB: ${POSTGRES_DB:-opsloop}
    command: ["postgres", "-c", "max_connections=200"]
    ports:
      # Host port defaults to 55432 to avoid clashing with a locally installed Postgres.
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *python
    environment: *db-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  taskflow-api:
    <<: *python
    environment:
      <<: *db-env
      TASKFLOW_JWT_SECRET: ${TASKFLOW_JWT_SECRET:-sim-dev-secret-not-for-production}
      TASKFLOW_VERSION: ${TASKFLOW_VERSION:-1.0.0}
    command: ["python", "-m", "taskflow.api"]
    restart: unless-stopped
    ports:
      - "8080:8080"
      # Fault control port: simulation harness only, bound to localhost, never given to agents.
      - "127.0.0.1:9100:9100"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  traffic-gen:
    <<: *python
    environment:
      TASKFLOW_URL: http://taskflow-api:8080
      TRAFFIC_PROFILE: /app/taskflow/traffic/profiles/default.yaml
      TRAFFIC_SEED: ${TRAFFIC_SEED:-42}
    command: ["python", "-m", "taskflow.traffic.runner"]
    restart: unless-stopped
    depends_on:
      taskflow-api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - taskflow-api

  opsloop-engine:
    <<: *python
    environment:
      <<: *db-env
      OPSLOOP_PROMETHEUS_URL: http://prometheus:9090
    command: ["python", "-m", "opsloop.engine"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      prometheus:
        condition: service_started

  opsloop-heartbeat:
    <<: *python
    environment: *db-env
    command: ["python", "-m", "opsloop.heartbeat"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  opsloop-web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_OPSLOOP_API: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - opsloop-api

  opsloop-api:
    <<: *python
    environment:
      <<: *db-env
      # Set both in .env: allowed dashboard origins, and approver/viewer tokens (JSON).
      OPSLOOP_CORS_ORIGINS: ${OPSLOOP_CORS_ORIGINS:-http://localhost:3000}
      OPSLOOP_API_TOKENS: ${OPSLOOP_API_TOKENS:-}
      OPSLOOP_PROMETHEUS_URL: http://prometheus:9090
      OPSLOOP_TASKFLOW_URL: http://taskflow-api:8080
      OPSLOOP_TASKFLOW_CONTROL_URL: http://taskflow-api:9100
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  pgdata:
