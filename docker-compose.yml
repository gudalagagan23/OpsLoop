# Stage 0: database + OpsLoop API skeleton.
# TaskFlow, traffic-gen, prometheus, router and the dashboard are added in later stages.
name: opsloop

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opsloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsloop}
      POSTGRES_DB: ${POSTGRES_DB:-opsloop}
    ports:
      # Host port defaults to 55432 to avoid clashing with a locally installed Postgres.
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  opsloop-api:
    build:
      context: .
      dockerfile: docker/opsloop-api.Dockerfile
    environment:
      OPSLOOP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-opsloop}:${POSTGRES_PASSWORD:-opsloop}@postgres:5432/${POSTGRES_DB:-opsloop}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  pgdata:
